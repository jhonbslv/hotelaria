<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova Reserva</title>

    <link rel="stylesheet" href="../static/css/add_reserva.css">

</head>
<body>

    <div class="container">

        <form action="/add_reserva" method="post">

            <h1>Cadastrar Reserva</h1>

            <div class="input_group">

                <label>Hóspede</label>

                <select name="hospede_id" required>

                    <option value="">
                        Selecione um hóspede
                    </option>

                    {% for h in hospedes %}

                    <option value="{{ h.id }}">

                        {{ h.nome }}

                    </option>

                    {% endfor %}

                </select>

            </div>

        
            <div class="input_group">

                <label>Quarto</label>

                <select name="quarto_id" required>

                    <option value="">
                        Selecione um quarto
                    </option>

                    {% for q in quartos %}

                    <option value="{{ q.id }}">

                        Quarto {{ q.numero }} - {{ q.tipo }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <div class="input_group">

                <label>Data de Entrada</label>

                <input type="date" name="data_entrada" required >

            </div>

            <div class="input_group">

                <label>Data de Saída</label>

                <input type="date" name="data_saida" required>

            </div>

            <div class="buttons">

                <a href="/reservas" class="btn_cancelar">
                    Cancelar
                </a>

                <button type="submit" class="btn_salvar">
                    Salvar
                </button>

            </div>

        </form>

    </div>

</body>
</html>

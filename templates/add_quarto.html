<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novo Quarto</title>

  <link rel="stylesheet" href="../static/css/form_quarto.css">

</head>
<body>

  <div class="container">

    <form action="/add_quarto" method="post">

      <h1>Cadastrar Quarto</h1>

      <div class="input_group">

        <label>Número do Quarto</label>

        <input type="text" name="numero" required>

      </div>

    <div class="input_group">

        <label>Tipo</label>

        <select name="tipo" required>

            <option value="Solteiro">
            Solteiro
            </option>

            <option value="Casal">
            Casal
            </option>

            <option value="Luxo">
            Luxo
            </option>

            <option value="Suíte">
            Suíte
            </option>

            <option value="Master">
            Master
            </option>

        </select>

    </div>

      <div class="input_group">

        <label>Valor da Diária</label>

        <input type="number" step="0.01" name="valor_diaria" required>

      </div>

      <div class="input_group">

        <label>Status</label>

        <select name="status">

          <option value="Disponível">
            Disponível
          </option>

          <option value="Ocupado">
            Ocupado
          </option>

          <option value="Manutenção">
            Manutenção
          </option>

        </select>

      </div>

      <div class="buttons">

        <a href="/quartos" class="btn_cancelar">

          Cancelar

        </a>

        <button type="submit" class="btn_salvar">

          Salvar

        </button>

      </div>

    </form>

  </div>

</body>
</html>

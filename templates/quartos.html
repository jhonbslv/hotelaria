<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quartos</title>

    <link rel="stylesheet" href="../static/css/quarto.css">
    <link rel="stylesheet" href="../static/css/index.css">
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">

        <div class="logo">

           <h1>

            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#202ec7" class="bi bi-building" viewBox="0 0 16 16">

            <path d="M4 2.5a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3 0a.5.5 0 0 1 .5-.5h1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-1a.5.5 0 0 1-.5-.5zm3.5-.5a.5.5 0 0 0-.5.5v1a.5.5 0 0 0 .5.5h1a.5.5 0 0 0 .5-.5v-1a.5.5 0 0 0-.5-.5z"/>

            <path d="M2 1a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1zm11 0H3v14h3v-2.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 .5.5V15h3z"/>

            </svg>

            Hotelaria

            </h1>

        </div>

        <!-- MENU -->
        <div class="paginas">
            <div class="pagina_4"> 
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house-door" viewBox="0 0 16 16">
                <path d="M8.354 1.146a.5.5 0 0 0-.708 0l-6 6A.5.5 0 0 0 1.5 7.5v7a.5.5 0 0 0 .5.5h4.5a.5.5 0 0 0 .5-.5v-4h2v4a.5.5 0 0 0 .5.5H14a.5.5 0 0 0 .5-.5v-7a.5.5 0 0 0-.146-.354L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM2.5 14V7.707l5.5-5.5 5.5 5.5V14H10v-4a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5v4z"/>
                </svg>  
                <a href="/">Tela inicial</a>

            </div>

            <div class="pagina_1">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#29292b" class="bi bi-person-fill" viewBox="0 0 16 16">
                <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                </svg>
                <a href="/hospedes">Hospedes</a>
            </div>

            <div class="pagina_2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#29292b" class="bi bi-alarm" viewBox="0 0 16 16">
                <path d="M8.5 5.5a.5.5 0 0 0-1 0v3.362l-1.429 2.38a.5.5 0 1 0 .858.515l1.5-2.5A.5.5 0 0 0 8.5 9z"/>
                <path d="M6.5 0a.5.5 0 0 0 0 1H7v1.07a7.001 7.001 0 0 0-3.273 12.474l-.602.602a.5.5 0 0 0 .707.708l.746-.746A6.97 6.97 0 0 0 8 16a6.97 6.97 0 0 0 3.422-.892l.746.746a.5.5 0 0 0 .707-.708l-.601-.602A7.001 7.001 0 0 0 9 2.07V1h.5a.5.5 0 0 0 0-1zm1.038 3.018a6 6 0 0 1 .924 0 6 6 0 1 1-.924 0M0 3.5c0 .753.333 1.429.86 1.887A8.04 8.04 0 0 1 4.387 1.86 2.5 2.5 0 0 0 0 3.5M13.5 1c-.753 0-1.429.333-1.887.86a8.04 8.04 0 0 1 3.527 3.527A2.5 2.5 0 0 0 13.5 1"/>
                </svg>
                <a href="/quartos">Quartos</a>
            </div>

            <div class="pagina_3">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="#29292b" class="bi bi-calendar3" viewBox="0 0 16 16">
                <path d="M14 0H2a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2M1 3.857C1 3.384 1.448 3 2 3h12c.552 0 1 .384 1 .857v10.286c0 .473-.448.857-1 .857H2c-.552 0-1-.384-1-.857z"/>
                <path d="M6.5 7a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m-9 3a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m-9 3a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2m3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
                </svg>
                <a href="/reservas">Reservas</a>
            </div>

            

        </div>

    </div>

    <!-- MAIN -->
    <main class="main">

        <!-- TOPO -->
        <div class="topo">

            <div>

                <h1>Gerenciamento de Quartos</h1>

                <p>Controle completo dos quartos</p>

            </div>

            <a href="/add_quarto" class="btn_add">

                Novo Quarto

            </a>

        </div>

    

        <!-- TABELA -->
        <div class="table_container">

            <div class="table_top">

                <h2>Lista de Quartos</h2>

            </div>

            <table>

                <thead>

                    <tr>

                        <th>Número</th>
                        <th>Tipo</th>
                        <th>Valor</th>
                        <th>Status</th>
                        <th>Ações</th>

                    </tr>

                </thead>

                <tbody>

                    {% for q in quartos %}

                    <tr>

                        <td>{{ q.numero }}</td>

                        <td>{{ q.tipo }}</td>

                        <td>R$ {{ q.valor_diaria }}</td>

                        <td>

                            <span class="status {{ q.status.lower() }}">

                                {{ q.status }}

                            </span>

                        </td>

                        <td class="acoes">

                            <a href="/edit_quarto/{{ q.id }}" class="btn_editar">

                                Editar

                            </a>

                            <form action="/delete_quarto/{{ q.id }}" method="post">

                                <button class="btn_excluir">

                                    Excluir

                                </button>

                            </form>

                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </main>

</body>
</html>
